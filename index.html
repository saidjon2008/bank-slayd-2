<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>우즈베키스탄의 주요 은행 | Main Banks in Uzbekistan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [data-th="mix"] {
        --a: #f3ede1;
        --hf: "Playfair Display", serif;
        --sh: #080c1499;
        --tt: none;
        --k: 1;
        --ls: -1px;
        --bg: #16202e;
      }
      [data-th="nbu"] {
        --a: #d7e8ff;
        --hf: "Space Grotesk", sans-serif;
        --sh: #061326b8;
        --tt: none;
        --k: 1;
        --ls: -1px;
        --bg: #0d2442;
      }
      [data-th="asaka"] {
        --a: #ff5b5b;
        --hf: "Bebas Neue", sans-serif;
        --sh: #250606bd;
        --tt: uppercase;
        --k: 1.12;
        --ls: 1px;
        --bg: #3a0d0d;
      }
      [data-th="kapital"] {
        --a: #e8b86a;
        --hf: "Playfair Display", serif;
        --sh: #211308b8;
        --tt: none;
        --k: 1;
        --ls: -1px;
        --bg: #3a2410;
      }
      [data-th="hamkor"] {
        --a: #8fe0a0;
        --hf: "Space Grotesk", sans-serif;
        --sh: #062214b8;
        --tt: none;
        --k: 0.95;
        --ls: -1px;
        --bg: #0b3320;
      }
      body {
        background: #05070a;
        color: #fff;
        font-family: Inter, sans-serif;
        overflow: hidden;
        height: 100vh;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transition: transform 1.1s cubic-bezier(0.77, 0, 0.18, 1);
        background: radial-gradient(circle at 70% 30%, var(--bg), #05070a 80%);
      }
      .photo {
        position: absolute;
        inset: -30px;
        transform: translate(
          calc(var(--px, 0) * -18px),
          calc(var(--py, 0) * -12px)
        );
        transition: transform 0.5s ease-out;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.18);
        transition: transform 12s ease;
      }
      .slide.on .photo img {
        transform: scale(1.02);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, #000e 0%, var(--sh) 55%, #0004 100%);
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      .spot {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 6;
        background: radial-gradient(
          420px circle at var(--mx, 50%) var(--my, 50%),
          color-mix(in srgb, var(--sa, #fff) 14%, transparent),
          transparent 70%
        );
        mix-blend-mode: screen;
      }
      #cur {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background: var(--cc, #fff);
        clip-path: inset(0 100% 0 0);
      }
      .nav {
        position: fixed;
        z-index: 20;
        top: 0;
        left: 0;
        right: 0;
        height: 78px;
        padding: env(safe-area-inset-top, 0px) 4% 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(#000a, transparent);
      }
      .brand {
        font: 700 11px Inter;
        letter-spacing: 5px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        padding: 5px;
        border-radius: 40px;
        background: #0007;
        backdrop-filter: blur(10px);
        border: 1px solid #fff3;
      }
      .tab {
        padding: 9px 18px;
        border-radius: 30px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #fffb;
        transition: 0.4s;
      }
      .tab.on {
        background: var(--tc);
        color: #111;
        font-weight: 700;
      }
      .cnt {
        font: 500 12px Inter;
        letter-spacing: 3px;
        min-width: 70px;
        text-align: right;
      }
      .ghost {
        position: absolute;
        z-index: 3;
        right: 4%;
        top: 70px;
        font: 700 clamp(140px, 26vw, 380px)/1 var(--hf);
        color: transparent;
        -webkit-text-stroke: 1px color-mix(in srgb, var(--a) 45%, transparent);
        opacity: 0;
        transform: translateX(120px) scale(0.85);
        filter: blur(14px);
        transition: 1.6s 0.5s cubic-bezier(0.16, 0.8, 0.2, 1);
        pointer-events: none;
        text-transform: var(--tt);
      }
      .slide.on .ghost {
        opacity: 0.55;
        transform: none;
        filter: none;
      }
      .body {
        position: absolute;
        z-index: 4;
        inset: 0;
        padding: 120px 5% 96px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 28px;
      }
      .eyebrow {
        color: var(--a);
        font: 500 11px Inter;
        display: flex;
        gap: 14px;
        align-items: center;
        opacity: 0;
        letter-spacing: 18px;
        transition:
          opacity 1s 0.2s,
          letter-spacing 1.8s 0.2s cubic-bezier(0.16, 0.8, 0.2, 1);
      }
      .slide.on .eyebrow {
        opacity: 1;
        letter-spacing: 5px;
      }
      .eyebrow:after {
        content: "";
        width: 0;
        height: 1px;
        background: currentColor;
        transition: width 1.2s 1s;
      }
      .slide.on .eyebrow:after {
        width: 60px;
      }
      .title {
        font: 700 calc(clamp(34px, 5.2vw, 82px) * var(--k))/1.05 var(--hf);
        letter-spacing: var(--ls);
        text-transform: var(--tt);
        max-width: 1000px;
        margin-top: 12px;
        perspective: 600px;
      }
      .w {
        display: inline-block;
        overflow: hidden;
        padding: 0 0.06em 0.1em 0;
        margin-right: 0.22em;
        vertical-align: top;
      }
      .ch {
        display: inline-block;
        transform: translateY(115%) rotateX(-90deg);
        filter: blur(8px);
        transform-origin: 50% 100%;
        transition:
          transform 1s cubic-bezier(0.16, 0.8, 0.2, 1),
          filter 1s;
        transition-delay: calc(var(--i) * 35ms + 350ms);
      }
      .slide.on .ch {
        transform: none;
        filter: none;
      }
      .lead {
        max-width: 720px;
        margin-top: 16px;
        font-size: clamp(14px, 1.3vw, 19px);
        line-height: 1.7;
        color: #ffffffd0;
      }
      .wd {
        display: inline-block;
        margin-right: 0.3em;
        opacity: 0;
        transform: translateY(14px);
        filter: blur(6px);
        transition: 0.7s;
        transition-delay: calc(var(--i) * 70ms + 900ms);
      }
      .slide.on .wd {
        opacity: 1;
        transform: none;
        filter: none;
      }
      .rv {
        display: block;
        opacity: 0;
        transform: translateY(26px);
        filter: blur(10px);
        clip-path: inset(0 100% 0 0);
        transition:
          opacity 0.9s,
          transform 0.9s cubic-bezier(0.16, 0.8, 0.2, 1),
          filter 0.9s,
          clip-path 1.1s cubic-bezier(0.77, 0, 0.18, 1);
        transition-delay: calc(var(--s) * 220ms + 1300ms);
      }
      .slide.on .rv {
        opacity: 1;
        transform: none;
        filter: none;
        clip-path: inset(0 0 0 0);
      }
      .items {
        display: grid;
        grid-template-columns: repeat(var(--n), 1fr);
        gap: clamp(14px, 2vw, 30px);
      }
      .it {
        position: relative;
        padding: 18px 18px 16px;
        border-radius: 14px;
        background: linear-gradient(160deg, #ffffff14, #00000040);
        backdrop-filter: blur(8px);
        border: 1px solid #ffffff1c;
        transform: perspective(700px) rotateX(var(--rx, 0deg))
          rotateY(var(--ry, 0deg));
        transition:
          transform 0.25s ease-out,
          border-color 0.4s,
          box-shadow 0.4s;
      }
      .it:before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: 100%;
        background: var(--c, var(--a));
        box-shadow: 0 0 18px var(--c, var(--a));
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1.2s cubic-bezier(0.77, 0, 0.18, 1);
        transition-delay: calc(var(--s0) * 220ms + 1100ms);
      }
      .slide.on .it:before {
        transform: scaleX(1);
      }
      .it:hover {
        border-color: var(--c, var(--a));
        box-shadow: 0 12px 40px -12px var(--c, var(--a));
      }
      .it h3 {
        font: 700 clamp(15px, 1.5vw, 22px) var(--hf);
        text-transform: var(--tt);
        letter-spacing: calc(var(--ls) / -2);
        color: var(--c, var(--a));
        margin-bottom: 10px;
      }

      /* Koreyscha va inglizcha matn o'lchamlari */
      .it .kr {
        color: #fff;
        font-size: 25px;
        line-height: 1.8;
        margin-bottom: 9px;
        font-weight: 500;
      }
      .it .en {
        color: #ffffffd4;
        font-size: 15px;
        line-height: 1.7;
        font-weight: 400;
      }

      .btn {
        align-self: flex-start;
        padding: 12px 24px;
        border: 1px solid var(--a);
        color: var(--a);
        border-radius: 30px;
        font-size: 12px;
        letter-spacing: 3px;
        transition: 0.3s;
      }
      .btn:hover {
        background: var(--a);
        color: #111;
      }
      .tri {
        position: absolute;
        inset: 0;
        display: flex;
      }
      .pan {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        transition: flex 1s cubic-bezier(0.77, 0, 0.18, 1);
        border-right: 1px solid #fff3;
        text-align: left;
        background: var(--bg);
        clip-path: inset(50% 0 50% 0);
        transition:
          clip-path 1.8s cubic-bezier(0.77, 0, 0.18, 1)
            calc(var(--p) * 200ms + 300ms),
          flex 1s cubic-bezier(0.77, 0, 0.18, 1);
      }
      .slide.on .pan {
        clip-path: inset(0);
      }
      .slide.on .pan img {
        animation: imgIn 2.6s calc(var(--p) * 200ms + 300ms)
          cubic-bezier(0.16, 0.8, 0.2, 1) backwards;
      }
      @keyframes imgIn {
        from {
          transform: scale(1.7);
          filter: brightness(3) saturate(0);
        }
      }
      .hero .w {
        overflow: visible;
      }
      .hero .ch {
        transform: scale(4);
        opacity: 0;
        filter: blur(24px);
        transition:
          transform 1.3s cubic-bezier(0.16, 0.8, 0.2, 1),
          opacity 1s,
          filter 1.3s;
        transition-delay: calc(var(--r) * 110ms + 900ms);
      }
      .slide.on.hero .ch {
        transform: none;
        opacity: 1;
        filter: none;
      }
      .hero .lead {
        margin: 16px auto 0;
        text-shadow: 0 2px 20px #000;
      }
      .hero .btn {
        pointer-events: auto;
        margin-top: 22px;
        align-self: center;
      }
      .closing .body {
        padding-bottom: 210px;
      }
      .closing .title {
        font-size: clamp(38px, 6vw, 96px);
      }
      .pan:hover {
        flex: 2.2;
      }
      .pan img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.6) brightness(0.6);
        transition:
          filter 0.8s,
          transform 1.4s;
      }
      .pan:hover img {
        filter: none;
        transform: scale(1.06);
      }
      .pan:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, #000e, transparent 60%);
      }
      .pan span {
        position: absolute;
        z-index: 2;
        left: 7%;
        bottom: 11%;
        right: 7%;
      }
      .pan b {
        display: block;
        font: 700 clamp(20px, 2.5vw, 40px)/1.1 var(--hf);
        text-transform: var(--tt);
        color: var(--a);
      }
      .pan small {
        display: block;
        margin-top: 10px;
        font-size: clamp(10px, 1vw, 13px);
        line-height: 1.5;
        color: #fffd;
        opacity: 0;
        max-height: 0;
        transition: 0.6s;
      }
      .pan:hover small {
        opacity: 1;
        max-height: 80px;
      }
      .hero .body {
        pointer-events: none;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-bottom: 230px;
      }
      .hero .title {
        font-size: clamp(46px, 8vw, 128px);
        text-shadow: 0 6px 50px #000;
      }
      .hero .eyebrow:after {
        display: none;
      }
      .bar {
        position: fixed;
        z-index: 30;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--pa, #fff);
        width: 0;
        transition:
          width 0.9s,
          background 0.6s;
        box-shadow: 0 0 14px var(--pa, #fff);
      }
      .foot {
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        height: 78px;
        padding: 0 4% env(safe-area-inset-bottom, 0px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 3px;
        color: #fffa;
      }
      .ctl {
        display: flex;
        gap: 9px;
      }
      .cb {
        width: 42px;
        height: 42px;
        border: 1px solid #fff7;
        border-radius: 50%;
        transition: 0.3s;
      }
      .cb:hover {
        background: #fff;
        color: #111;
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 99;
        background: #05070a;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          italic 500 clamp(36px, 7vw, 90px) "Playfair Display",
          serif;
        transition:
          opacity 1s,
          visibility 1s;
      }
      .loader.hide {
        opacity: 0;
        visibility: hidden;
      }

      @media (max-width: 900px) {
        .items {
          grid-template-columns: 1fr;
        }
        .tab {
          padding: 8px 10px;
          font-size: 9px;
          letter-spacing: 1px;
        }
        .brand,
        .foot span {
          display: none;
        }
        .body {
          justify-content: flex-start;
          overflow-y: auto;
          padding: 100px 6% 84px;
        }
        .ghost {
          font-size: 34vw;
          top: 80px;
        }
        .pan:hover {
          flex: 1;
        }
        .pan small {
          display: none;
        }
        .pan b {
          font-size: clamp(14px, 3vw, 25px);
          overflow-wrap: anywhere;
        }
        .hero .body {
          padding: 110px 6% 0;
          justify-content: flex-start;
        }
        .hero .title {
          font-size: clamp(38px, 8vw, 70px);
        }
        .cb {
          width: 36px;
          height: 36px;
        }
        .nav {
          padding: 0 3%;
          gap: 8px;
        }
        .tabs {
          gap: 3px;
          max-width: 80%;
          overflow-x: auto;
        }
        .cnt {
          min-width: 48px;
          font-size: 10px;
          letter-spacing: 1px;
        }
      }

      /* Slaydlar uchun alohida o'tish effektlari */
      .slide[data-fx="a"] .rv,
      .slide[data-fx="b"] .rv,
      .slide[data-fx="c"] .rv,
      .slide[data-fx="d"] .rv {
        transition-timing-function: cubic-bezier(0.16, 0.8, 0.2, 1);
      }
      .slide[data-fx="a"] .rv {
        clip-path: inset(0);
      }
      .slide[data-fx="a"]:not(.on) .ch {
        transform: translateY(-115%) rotateX(90deg);
      }
      .slide[data-fx="a"]:not(.on) .rv {
        transform: perspective(600px) rotateX(-80deg) translateY(40px);
        transform-origin: 50% 100%;
      }
      .slide[data-fx="a"]:not(.on) .ghost {
        transform: translateY(-220px);
      }
      .slide[data-fx="b"] .w,
      .slide[data-fx="c"] .w {
        overflow: visible;
      }
      .slide[data-fx="b"] .ch,
      .slide[data-fx="c"] .ch {
        transition-property: transform, filter, opacity;
      }
      .slide[data-fx="b"] .ch {
        transition-duration: 0.8s;
        transition-timing-function: cubic-bezier(0.2, 1.5, 0.3, 1);
      }
      .slide[data-fx="b"]:not(.on) .ch {
        transform: scale(4);
        opacity: 0;
        filter: blur(18px);
      }
      .slide[data-fx="b"]:not(.on) .rv {
        clip-path: inset(50% 0 50% 0);
        transform: skewX(-25deg) translateX(-70px);
      }
      .slide[data-fx="b"]:not(.on) .ghost {
        transform: scale(2.4);
      }
      .slide[data-fx="c"] .ch {
        transition-duration: 1.8s;
      }
      .slide[data-fx="c"]:not(.on) .ch {
        transform: scale(1.9);
        opacity: 0;
        filter: blur(16px);
      }
      .slide[data-fx="c"]:not(.on) .rv {
        clip-path: inset(0 50% 0 50%);
        transform: scale(0.9);
      }
      .slide[data-fx="c"]:not(.on) .ghost {
        transform: scale(0.6);
      }
      .slide[data-fx="c"] .it:before {
        transform-origin: center;
      }
      .slide[data-fx="d"]:not(.on) .ch {
        transform: translateX(130%) skewX(25deg);
      }
      .slide[data-fx="d"]:not(.on) .rv {
        clip-path: inset(0 0 0 100%);
        transform: translateX(70px);
      }
      .slide[data-fx="d"]:not(.on) .ghost {
        transform: translateX(-220px);
      }
      .slide[data-fx="d"] .it:before {
        transform-origin: right;
      }

      /* Ikki rasmli slaydlar */
      .bgp {
        position: absolute;
        inset: -30px;
        transform: translate(
          calc(var(--px, 0) * -18px),
          calc(var(--py, 0) * -12px)
        );
        transition: transform 0.5s ease-out;
      }
      .bgp img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: blur(20px) brightness(0.5) saturate(1.2);
        transform: scale(1.1);
      }
      .body.two {
        flex-direction: row;
        align-items: stretch;
        justify-content: space-between;
        gap: 4%;
      }
      .txt {
        flex: 1 1 44%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 22px;
      }
      .two .title {
        font-size: calc(clamp(30px, 4vw, 64px) * var(--k));
      }
      .two .items {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .two .it {
        padding: 12px 16px;
      }
      .two .it h3 {
        font-size: clamp(13px, 1.2vw, 17px);
        margin-bottom: 4px;
      }
      .two .it .kr {
        font-size: 25px;
        line-height: 1.8;
        margin-bottom: 4px;
      }
      .two .it .en {
        font-size: 15px;
        line-height: 1.7;
      }
      .duo {
        flex: 1 1 52%;
        position: relative;
        min-width: 0;
        perspective: 1600px;
      }
      .duo figure {
        position: absolute;
        overflow: hidden;
        border-radius: 18px;
        background: var(--bg);
        border: 1px solid #ffffff38;
        transition:
          transform 1.7s cubic-bezier(0.16, 0.8, 0.2, 1),
          clip-path 1.7s cubic-bezier(0.77, 0, 0.18, 1),
          opacity 1.1s;
      }
      .duo .f1 {
        left: 0;
        top: 2%;
        width: 70%;
        height: 72%;
        transition-delay: 0.5s;
      }
      .duo .f2 {
        right: 0;
        bottom: 0;
        width: 58%;
        height: 56%;
        z-index: 2;
        border: 3px solid var(--a);
        transition-delay: 1s;
      }
      .duo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.25);
        transition: transform 7s ease;
      }
      .slide.on .duo img {
        transform: scale(1);
      }
      .duo figcaption {
        position: absolute;
        left: 14px;
        bottom: 12px;
        z-index: 2;
        font: 500 10px Inter;
        letter-spacing: 3px;
        color: var(--a);
        text-shadow: 0 2px 12px #000;
      }
      .duo figure:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, #000a, transparent 45%);
      }
      .slide[data-fx="a"] .duo figure {
        clip-path: inset(0);
      }
      .slide[data-fx="a"]:not(.on) .f1 {
        clip-path: inset(100% 0 0 0);
        transform: translateY(70px);
      }
      .slide[data-fx="a"]:not(.on) .f2 {
        clip-path: inset(0 0 100% 0);
        transform: translateY(-70px);
      }
      .slide[data-fx="b"] .duo figure {
        transition-timing-function: cubic-bezier(0.2, 1.25, 0.3, 1);
      }
      .slide[data-fx="b"]:not(.on) .f1 {
        transform: translateY(-130%) rotate(-9deg);
        opacity: 0;
      }
      .slide[data-fx="b"]:not(.on) .f2 {
        transform: translateX(130%) rotate(11deg);
        opacity: 0;
      }
      .slide[data-fx="c"] .f1 {
        transform-origin: left center;
      }
      .slide[data-fx="c"] .f2 {
        transform-origin: right center;
      }
      .slide[data-fx="c"]:not(.on) .f1 {
        transform: rotateY(-95deg);
        opacity: 0;
      }
      .slide[data-fx="c"]:not(.on) .f2 {
        transform: rotateY(95deg);
        opacity: 0;
      }
      .slide[data-fx="d"] .f1 {
        clip-path: circle(150% at 0% 0%);
      }
      .slide[data-fx="d"] .f2 {
        clip-path: circle(150% at 100% 100%);
      }
      .slide[data-fx="d"]:not(.on) .f1 {
        clip-path: circle(0% at 0% 0%);
      }
      .slide[data-fx="d"]:not(.on) .f2 {
        clip-path: circle(0% at 100% 100%);
      }
      .slide[data-fx="d"]:not(.on) .duo img {
        transform: scale(1.7);
      }

      @media (max-width: 900px) {
        .body.two {
          flex-direction: column;
          gap: 18px;
        }
        .duo {
          flex: none;
          height: 78vw;
          order: -1;
        }
        .txt {
          flex: none;
        }
        .it .kr,
        .two .it .kr {
          font-size: 22px;
          line-height: 1.7;
        }
        .it .en,
        .two .it .en {
          font-size: 13.5px;
          line-height: 1.65;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ch,
        .wd,
        .rv {
          transition-duration: 0.01s !important;
          transition-delay: 0s !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="loader" id="loader">Banks of Uzbekistan</div>
    <canvas id="fx"></canvas>
    <div class="spot" id="spot"></div>
    <div id="cur"></div>

    <header class="nav">
      <div class="brand">UZBEKISTAN · BANKING</div>
      <div class="tabs" id="tabs"></div>
      <div class="cnt" id="cnt">01 / 06</div>
    </header>

    <main id="stage"></main>
    <div class="bar" id="bar"></div>

    <footer class="foot">
      <span>← → · SCROLL · SWIPE · 1–6</span>
      <div class="ctl">
        <button class="cb" id="prev" aria-label="Previous">←</button>
        <button class="cb" id="next" aria-label="Next">→</button>
        <button class="cb" id="full" aria-label="Fullscreen">⛶</button>
      </div>
    </footer>

    <script>
      const U = (id) =>
        `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=2000&q=85`;
      const W = "https://commons.wikimedia.org/wiki/Special:FilePath/";

      const P = {
        nbu: W + "Toshkent_Building_of_NBU.jpg",
        asaka: W + "Tashkent_City_Central_Bank_Towers.jpg",
        kapital: W + "Kapital_bank.jpg",
        hamkor: W + "Головной_офис_Hamkorbank_в_городе_Андижан.jpg",
        city: U("1486406146926-c627a92ad1ab"),
        nbuIn: U("1497366216548-37526070297c"),
        asakaIn: U("1497366811353-6870744d04b2"),
        kapitalIn: U("1524758631624-e2822e304c36"),
        hamkorIn: U("1497215728101-856f4ea42174"),
      };

      const TC = {
        nbu: "#d7e8ff",
        asaka: "#ff5b5b",
        kapital: "#e8b86a",
        hamkor: "#8fe0a0",
        mix: "#ffffff",
      };

      /* SLAYDLAR MATNI — foydalanuvchi bergan variant */
      const data = [
        {
          th: "mix",
          hero: 1,
          eyebrow: "우즈베키스탄의 주요 은행 · MAIN BANKS IN UZBEKISTAN",
          title: "Banks of Uzbekistan",
          pans: [
            ["nbu", P.nbu, "국립은행", "National Bank", 1],
            ["asaka", P.asaka, "아사카은행", "Asakabank", 2],
            ["kapital", P.kapital, "카피탈은행", "Kapitalbank", 3],
            ["hamkor", P.hamkor, "함코르은행", "Hamkorbank", 4],
          ],
        },
        {
          th: "nbu",
          fx: "a",
          img: P.nbu,
          int: P.nbuIn,
          num: "01",
          eyebrow: "국립은행 · NATIONAL BANK",
          title: "National Bank",
          lead: "설립 연도: 1991년 · Established in 1991",
          items: [
            [
              "#d7e8ff",
              "01 / HISTORY",
              "독립 이후 주요 은행 중 하나",
              "One of the major banks established after independence",
            ],
            [
              "#d7e8ff",
              "02 / CUSTOMERS",
              "개인과 큰 회사 모두 이용",
              "Used by individuals and large companies",
            ],
          ],
        },
        {
          th: "asaka",
          fx: "b",
          img: P.asaka,
          int: P.asakaIn,
          num: "02",
          eyebrow: "아사카은행 · ASAKABANK",
          title: "Asakabank",
          lead: "설립 연도: 1995년 · Established in 1995",
          items: [
            [
              "#ff5b5b",
              "01 / INDUSTRY",
              "자동차 산업과 관련",
              "Connected to the automotive industry",
            ],
            [
              "#ff5b5b",
              "02 / SUPPORT",
              "자동차 산업 지원",
              "Supports the automotive industry",
            ],
          ],
        },
        {
          th: "kapital",
          fx: "c",
          img: P.kapital,
          int: P.kapitalIn,
          num: "03",
          eyebrow: "카피탈은행 · KAPITALBANK",
          title: "Kapitalbank",
          lead: "설립 연도: 2001년 · Established in 2001",
          items: [
            [
              "#e8b86a",
              "01 / HISTORY",
              "2004년: 아비아은행과 합병",
              "Merged with Aviabank in 2004",
            ],
            [
              "#e8b86a",
              "02 / TECHNOLOGY",
              "새로운 기술 사용",
              "Uses new technologies",
            ],
          ],
        },
        {
          th: "hamkor",
          fx: "d",
          img: P.hamkor,
          int: P.hamkorIn,
          num: "04",
          eyebrow: "함코르은행 · HAMKORBANK",
          title: "Hamkorbank",
          lead: "설립 연도: 1991년 · Established in 1991",
          items: [
            [
              "#8fe0a0",
              "01 / ORIGINAL NAME",
              "처음 이름: 안디잔은행",
              "Original name: Andijanbank",
            ],
            [
              "#8fe0a0",
              "02 / NAME CHANGE",
              "2000년: 이름 변경",
              "Name changed in 2000",
            ],
            [
              "#8fe0a0",
              "03 / MOBILE SERVICE",
              "2018년: 모바일 앱으로 가상 비자 카드 발급",
              "Launched a virtual Visa card service through a mobile app in 2018",
            ],
          ],
        },
        {
          th: "mix",
          closing: 1,
          pans: [
            ["nbu", P.nbu, "국립은행", "National Bank", 1],
            ["asaka", P.asaka, "아사카은행", "Asakabank", 2],
            ["kapital", P.kapital, "카피탈은행", "Kapitalbank", 3],
            ["hamkor", P.hamkor, "함코르은행", "Hamkorbank", 4],
          ],
          eyebrow: "결론 · CONCLUSION",
          title: "Conclusion",
          items: [
            [
              "#d7e8ff",
              "01",
              "각 은행의 특별한 역사",
              "Each bank has a unique history",
            ],
            [
              "#8fe0a0",
              "02",
              "우리 생활에 중요한 역할",
              "Plays an important role in our daily lives",
            ],
          ],
        },
      ];

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const title = (t) => {
        let i = 0;
        return t
          .split(" ")
          .map(
            (w) =>
              `<span class="w">${[...w]
                .map(
                  (c) =>
                    `<span class="ch" style="--i:${i};--r:${(i++ * 7) % 9}">${esc(c)}</span>`,
                )
                .join("")}</span>`,
          )
          .join("");
      };

      const words = (t) =>
        t
          .split(/\s+/)
          .map((w, i) => `<span class="wd" style="--i:${i}">${esc(w)}</span>`)
          .join("");

      const img = (src) =>
        `<img src="${src}" alt="" onerror="this.style.opacity=0">`;

      function makeSlide(d) {
        if (d.pans) {
          let closing = d.closing ? " closing" : "";
          let lead = d.lead ? `<p class="lead">${words(d.lead)}</p>` : "";
          let restart = d.closing
            ? `<button class="btn rv" style="--s:0" id="restart">↺ BACK TO START</button>`
            : "";
          return `<section class="slide hero${closing}" data-th="mix">
      <div class="tri">${d.pans
        .map(
          (p, k) =>
            `<button class="pan" style="--p:${k}" data-th="${p[0]}" data-go="${p[4]}">
          ${img(p[1])}
          <span><b>${p[2]}</b><small>${p[3]}</small></span>
        </button>`,
        )
        .join("")}</div>
      <div class="body">
        <div class="eyebrow">${d.eyebrow}</div>
        <h1 class="title">${title(d.title)}</h1>
        ${lead}${restart}
      </div>
    </section>`;
        }

        let s = 0;
        const items = d.items
          .map((it) => {
            const s0 = s;
            const h = `<h3><span class="rv" style="--s:${s++}">${esc(it[1])}</span></h3>`;
            const kr = `<p class="kr"><span class="rv" style="--s:${s++}">${esc(it[2])}</span></p>`;
            const en = `<p class="en"><span class="rv" style="--s:${s++}">${esc(it[3])}</span></p>`;
            return `<div class="it" style="--c:${it[0]};--s0:${s0}">${h}${kr}${en}</div>`;
          })
          .join("");

        return `<section class="slide" data-th="${d.th}" data-fx="${d.fx}">
    <div class="bgp">${img(d.img)}</div>
    <div class="shade"></div>
    <div class="ghost">${d.num}</div>
    <div class="body two">
      <div class="txt">
        <div>
          <div class="eyebrow">${esc(d.eyebrow)}</div>
          <h1 class="title">${title(d.title)}</h1>
          ${d.lead ? `<p class="lead">${words(d.lead)}</p>` : ""}
        </div>
        <div class="items">${items}</div>
      </div>
      <div class="duo">
        <figure class="f1">${img(d.img)}<figcaption>건물 · EXTERIOR</figcaption></figure>
        <figure class="f2">${img(d.int)}<figcaption>내부 · INTERIOR</figcaption></figure>
      </div>
    </div>
  </section>`;
      }

      const stage = document.getElementById("stage");
      stage.innerHTML = data.map(makeSlide).join("");

      const slides = [...stage.children],
        total = slides.length;
      const tabs = document.getElementById("tabs");

      tabs.innerHTML = [
        ["nbu", "NATIONAL BANK", 1],
        ["asaka", "ASAKABANK", 2],
        ["kapital", "KAPITALBANK", 3],
        ["hamkor", "HAMKORBANK", 4],
      ]
        .map(
          (t) =>
            `<button class="tab" data-th="${t[0]}" data-go="${t[2]}" style="--tc:${TC[t[0]]}">${t[1]}</button>`,
        )
        .join("");

      let cur = -1,
        busy = false,
        auto = false,
        timer;
      const curtain = document.getElementById("cur");

      function goTo(i) {
        if (busy || i === cur || i < 0 || i >= total) return;
        const first = cur < 0;
        busy = true;
        cur = i;
        const th = data[i].th,
          col = TC[th] || "#fff";

        if (!first && curtain.animate) {
          curtain.style.setProperty("--cc", col);
          curtain.animate(
            [
              { clipPath: "inset(0 100% 0 0)" },
              { clipPath: "inset(0 0 0 0)", offset: 0.45 },
              { clipPath: "inset(0 0 0 100%)" },
            ],
            { duration: 1200, easing: "cubic-bezier(.77,0,.18,1)" },
          );
        }

        slides.forEach((s, k) => {
          s.style.transform = `translateX(${(k - i) * 100}%)`;
          s.classList.remove("on");
          s.inert = k !== i;
        });

        setTimeout(() => slides[i].classList.add("on"), first ? 50 : 350);
        document.body.dataset.th = th;
        document.documentElement.style.setProperty("--sa", col);

        document.getElementById("bar").style.cssText +=
          `width:${((i + 1) / total) * 100}%;--pa:${col}`;

        document.getElementById("cnt").textContent =
          `${String(i + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;

        [...tabs.children].forEach((b) =>
          b.classList.toggle("on", b.dataset.th === th),
        );

        try {
          history.replaceState(null, "", "#" + (i + 1));
        } catch (e) {}

        clearTimeout(timer);
        if (auto) timer = setTimeout(next, 12000);
        setTimeout(() => (busy = false), 1100);
      }

      const next = () => goTo((cur + 1) % total);
      const prev = () => goTo((cur - 1 + total) % total);

      document.getElementById("next").onclick = next;
      document.getElementById("prev").onclick = prev;

      document.addEventListener("click", (e) => {
        const g = e.target.closest("[data-go]");
        if (g) goTo(Number(g.dataset.go));
        if (e.target.closest("#restart")) goTo(0);
      });

      document.addEventListener("keydown", (e) => {
        if (e.target.closest("button") && ["Enter", " "].includes(e.key))
          return;

        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
          e.preventDefault();
          next();
        } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
          e.preventDefault();
          prev();
        } else if (/^[1-6]$/.test(e.key)) {
          goTo(Number(e.key) - 1);
        } else if (e.key.toLowerCase() === "f") {
          document.getElementById("full").click();
        } else if (e.key.toLowerCase() === "a") {
          auto = !auto;
          clearTimeout(timer);
          if (auto) timer = setTimeout(next, 12000);
        }
      });

      document.getElementById("full").onclick = async () => {
        try {
          document.fullscreenElement
            ? await document.exitFullscreen()
            : await document.documentElement.requestFullscreen();
        } catch (e) {}
      };

      let lock = false;
      document.addEventListener(
        "wheel",
        (e) => {
          if (
            lock ||
            Math.abs(e.deltaY) < 25 ||
            matchMedia("(max-width:900px)").matches
          )
            return;
          lock = true;
          e.deltaY > 0 ? next() : prev();
          setTimeout(() => (lock = false), 1300);
        },
        { passive: true },
      );

      let tx = 0,
        ty = 0;
      document.addEventListener(
        "touchstart",
        (e) => {
          tx = e.changedTouches[0].clientX;
          ty = e.changedTouches[0].clientY;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - tx;
          const dy = e.changedTouches[0].clientY - ty;
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
            dx < 0 ? next() : prev();
          }
        },
        { passive: true },
      );

      addEventListener("hashchange", () => {
        const n = parseInt(location.hash.slice(1), 10);
        if (n >= 1 && n <= total) goTo(n - 1);
      });

      /* Spotlight, parallax va 3D kartalar */
      document.addEventListener("mousemove", (e) => {
        const s = document.getElementById("spot").style;
        s.setProperty("--mx", e.clientX + "px");
        s.setProperty("--my", e.clientY + "px");

        const px = e.clientX / innerWidth - 0.5;
        const py = e.clientY / innerHeight - 0.5;

        document.querySelectorAll(".bgp").forEach((p) => {
          p.style.setProperty("--px", px);
          p.style.setProperty("--py", py);
        });

        const it = e.target.closest && e.target.closest(".it");
        document.querySelectorAll(".it").forEach((c) => {
          if (c === it) {
            const r = c.getBoundingClientRect();
            c.style.setProperty(
              "--ry",
              ((e.clientX - r.left) / r.width - 0.5) * 10 + "deg",
            );
            c.style.setProperty(
              "--rx",
              -((e.clientY - r.top) / r.height - 0.5) * 10 + "deg",
            );
          } else {
            c.style.setProperty("--rx", "0deg");
            c.style.setProperty("--ry", "0deg");
          }
        });
      });

      /* Suzuvchi yorug'lik zarralari */
      const cv = document.getElementById("fx"),
        cx = cv.getContext("2d");
      let ps = [];

      function rs() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }
      rs();
      addEventListener("resize", rs);

      for (let i = 0; i < 55; i++) {
        ps.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 2 + 0.5,
          v: Math.random() * 0.4 + 0.15,
          d: Math.random() * 6,
        });
      }

      (function loop(t) {
        cx.clearRect(0, 0, cv.width, cv.height);
        cx.fillStyle =
          getComputedStyle(document.documentElement).getPropertyValue("--sa") ||
          "#fff";

        ps.forEach((p) => {
          p.y -= p.v;
          p.x += Math.sin(t / 1500 + p.d) * 0.3;

          if (p.y < -5) {
            p.y = cv.height + 5;
            p.x = Math.random() * cv.width;
          }

          cx.globalAlpha = 0.25 + 0.25 * Math.sin(t / 700 + p.d);
          cx.beginPath();
          cx.arc(p.x, p.y, p.r, 0, 6.283);
          cx.fill();
        });

        requestAnimationFrame(loop);
      })(0);

      slides.forEach((s) => (s.style.transform = "translateX(100%)"));

      setTimeout(() => {
        document.getElementById("loader").classList.add("hide");
        const n = parseInt(location.hash.slice(1), 10);
        goTo(n >= 1 && n <= total ? n - 1 : 0);
      }, 1500);
    </script>
  </body>
</html>
